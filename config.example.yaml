# Example dfsmount config. Default lookup path: ~/.config/dfsmount.yaml
poll_interval: 2  # seconds between /proc scans; fanotify events are handled immediately

# Only needed for `dfsmount service` (which must run as root, for fanotify).
# Mounts, unmounts, and archive creation all run as this user - never root.
run_as: alice

processes:
  - name: launcherexec          # matched against /proc/<pid>/comm (15-char truncated)
    archives_dir: /backups/game-archives    # "<target>-rev<N>.dfs" files live here
    working_dir: .local/state/launcher # per-target ro/upper/work dirs
    target_mount_dir: Games    # each target appears at <this>/<target>

    # Optional, all omittable. Shell commands (parsed like a shell command
    # line); the relevant path(s) are appended as extra arguments. Run under
    # `run_as`'s credentials, never root. A failing hook is logged but does
    # not block the mount/archive operation it wraps.
    # Paths can be absolute, start with "~", or relative to the user's home dir
    hooks:
      pre_archive: .local/bin/before-pack.sh      # arg: source_dir
      post_archive: .local/bin/after-pack.sh      # args: source_dir, archive_path
      pre_mount: .local/bin/before-mount.sh       # arg: mount_dir
      post_mount: .local/bin/after-mount.sh       # arg: mount_dir
      pre_unmount: .local/bin/before-unmount.sh   # arg: mount_dir
      post_unmount: .local/bin/after-unmount.sh   # arg: mount_dir

# Default lookup path: ~/.config/dfsmount.yaml
poll_interval: 2

launchers:
  - name: lutris                    # matched against /proc/<pid>/comm
    archives_dir: /backups/game-archives   # "<target>-rev<N>.dfs" files
    working_dir: .local/state/dfsmount/lutris  # per-target ro/upper/work dirs
    target_mount_dir: Games/lutris         # each target mounts at <this>/<target>

    hooks:
      pre_archive: builtin:hooks/lutris/prepack.py    # captures Lutris metadata
      install: builtin:hooks/lutris/install.py        # registers with Lutris
      uninstall: builtin:hooks/lutris/uninstall.py     # removes from Lutris

[project]
name = "dfsmount"
version = "0.2.0"
description = "Archive directories as dwarfs images; lazily mount dwarfs+fuse-overlayfs on process/access"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
dfsmount = "dfsmount.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dfsmount*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "A"]

